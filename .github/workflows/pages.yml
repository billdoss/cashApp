name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparer le site (sans les fichiers du dépôt)
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js icons _site/
          touch _site/.nojekyll
      - name: Générer les icônes PNG à partir des SVG
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          cd _site/icons
          rsvg-convert -w 192 -h 192 icon.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png
          rsvg-convert -w 512 -h 512 icon-maskable.svg -o maskable-512.png
          rsvg-convert -w 180 -h 180 icon-maskable.svg -o apple-touch-icon.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
