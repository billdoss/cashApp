<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>FedhApp</title>
<meta name="description" content="Suivi des dépenses, budgets, prévisions et conseils d'épargne. Données chiffrées sur votre téléphone.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B121B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="FedhApp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><i><svg viewBox="0 0 24 24"><path d="M4 16l5-5 4 4 7-8"/></svg></i>FedhApp</div>
    <div class="hr"><span class="sync" id="sync" aria-live="polite"></span>
      <button class="icon-btn" data-act="lockNow" aria-label="Verrouiller"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      <button class="icon-btn" data-act="settings" aria-label="Paramètres"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<div class="dock"><div class="dock-in">
  <button class="fab" id="fab" data-act="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Dépense</button>
  <nav id="nav" aria-label="Navigation principale"></nav>
</div></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<div id="lock" role="dialog" aria-modal="true" aria-label="Verrouillage de l'application"></div>
<noscript><p style="padding:24px">FedhApp a besoin de JavaScript pour fonctionner.</p></noscript>
<script defer src="js/config.js"></script>
<script defer src="js/shell.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/sync.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/lock.js"></script>
</body>
</html>
